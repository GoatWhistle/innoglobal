<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<title>README assets</title>
<link rel="stylesheet" href="../src/core/css/tokens.css">
<link rel="stylesheet" href="../src/core/css/brand.css">
<style>
html,
body {
  margin: 0;
  background: transparent;
}

body {
  display: grid;
  justify-items: start;
  gap: 32px;
  padding: 48px;
  font-family: var(--font-sans);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}

[data-asset] {
  box-sizing: border-box;
}

#generated {
  display: grid;
  justify-items: start;
  gap: 24px;
}

#icons {
  display: none;
}

.banner {
  position: relative;
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 22px;
  width: 880px;
  height: 200px;
}

.banner .lockup {
  position: relative;
  justify-content: center;
  --word-size: 88px;
}

.mark {
  display: block;
}

.mark svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.promise {
  position: relative;
  max-width: 720px;
  margin: 18px 0 0;
  text-align: center;
  font-size: 24px;
  line-height: 1.3;
  letter-spacing: -0.01em;
  color: var(--text-secondary);
  text-wrap: balance;
}

.promise em {
  font-style: normal;
  color: var(--text-accent, var(--action-primary));
}

.cta {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  height: 44px;
  padding: 0 18px 0 14px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--surface-raised);
  font-size: 16px;
  font-weight: 600;
  white-space: nowrap;
  color: var(--text-primary);
}

.cta.is-primary {
  border-color: transparent;
  background: var(--action-primary);
  color: var(--action-primary-text);
}

.cta svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: var(--icon-stroke, 1.5);
  stroke-linecap: butt;
  stroke-linejoin: miter;
}

.badge {
  display: inline-flex;
  align-items: stretch;
  height: 28px;
  overflow: hidden;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  font-size: 13px;
  line-height: 1;
  white-space: nowrap;
}

.badge > span {
  display: inline-flex;
  align-items: center;
  padding: 0 10px;
}

.badge > .label {
  background: var(--surface-sunken);
  color: var(--text-secondary);
}

.badge > .value {
  background: var(--surface-raised);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
}

.badge.is-accent {
  border-color: var(--action-primary);
}

.badge.is-accent > .value {
  background: var(--action-primary);
  color: var(--action-primary-text);
}

.badge.is-nav {
  height: 26px;
  border-color: var(--border-subtle);
  border-radius: var(--radius-pill);
}

.badge.is-nav > .value {
  padding: 0 12px;
  font-weight: 500;
  color: var(--text-secondary);
}

.badge.is-warning > .value {
  color: var(--text-warning, var(--status-warning));
}

.text {
  display: block;
  line-height: 1;
  text-box: trim-both cap alphabetic;
}
</style>
</head>
<body>

<div class="banner" data-asset="banner">
  <div class="lockup">
    <span class="wordmark">duppel</span>
    <span class="mark" data-mark></span>
  </div>
  <p class="promise">Цифровой двойник трубопровода, <em>который находит утечку по расхождению с замером</em></p>
</div>

<span class="mark" data-asset="mark" data-mark style="width: 32px; height: 32px"></span>

<div id="generated"></div>

<div id="icons">
  <svg data-icon="external-link" viewBox="0 0 24 24"><path d="M14.25 3.75h6v6M20.25 3.75l-9 9M17.25 14.25v6H3.75V6.75h6"/></svg>
  <svg data-icon="terminal" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.25v7.5L15.75 12z"/></svg>
  <svg data-icon="book-open" viewBox="0 0 24 24"><path d="M5.25 3h13.5v18H5.25zM8.25 7.5h7.5M8.25 11.25h7.5M8.25 15h4.5"/></svg>
  <svg data-icon="play" viewBox="0 0 24 24"><path d="M7.5 4.5v15l12-7.5z"/></svg>
  <svg data-icon="file-text" viewBox="0 0 24 24"><path d="M5.25 3h13.5v18H5.25zM8.25 7.5h7.5M8.25 11.25h7.5M8.25 15h4.5"/></svg>
</div>

</body>
</html>
