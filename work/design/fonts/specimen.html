<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шрифты: образцы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;600&family=Geologica:wght@300;400;600&family=Golos+Text:wght@400;600&family=Wix+Madefor+Display:wght@400;600&family=Commissioner:wght@300;400;600&family=Jost:wght@300;400;600&family=Geist:wght@300;400;600&family=Raleway:ital,wght@1,300;1,400&family=Martian+Mono:wght@300;400&family=IBM+Plex+Mono:wght@400&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root { --ink: #0a0a0a; --mute: #6b6b6b; --line: #d9d9d9; --paper: #fff; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; padding: 32px 40px; }
.row { display: grid; grid-template-columns: 160px 1fr 1fr; gap: 32px; padding: 28px 0; border-top: 1px solid var(--line); align-items: start; }
.name { font-size: 12px; color: var(--mute); }
.name b { display: block; color: var(--ink); font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.display { font-size: 64px; line-height: .95; font-weight: 300; letter-spacing: -.02em; }
.display em { font-family: "Raleway"; font-style: italic; font-weight: 300; }
.h { font-size: 28px; line-height: 1.1; font-weight: 400; margin-top: 14px; }
.body { font-size: 16px; line-height: 1.5; max-width: 52ch; }
.nums { margin-top: 14px; font-size: 22px; font-variant-numeric: tabular-nums; font-weight: 400; }
.small { margin-top: 10px; font-size: 12px; color: var(--mute); }
.ui { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
.pill { border: 1px solid var(--ink); border-radius: 999px; padding: 10px 24px; font-size: 15px; }
.pill.f { background: var(--ink); color: var(--paper); }
.mono .display { font-size: 40px; }
.check { font-size: 11px; color: #b0261c; }
</style>
</head>
<body>
<template id="t">
  <div class="row">
    <div class="name"><b></b><span class="note"></span><div class="check"></div></div>
    <div>
      <div class="display">Утечка <em>н</em>айдена<br>за 4,2 секунды</div>
      <div class="h">Цифровой двойник участка трубопровода</div>
      <div class="ui"><span class="pill f">Запустить поток</span><span class="pill">Вставить утечку</span></div>
    </div>
    <div>
      <p class="body">Давление на датчике Д-07 упало на 0,37 бар относительно модели. Расхождение держится дольше порога, поэтому система отмечает участок 1 240–1 380 м как место вероятной утечки.</p>
      <div class="nums">Δp 0,37 бар · Q 1 245,8 м³/ч · t 41,6 °C<br>0123456789 ₽ № §</div>
      <div class="small">Жёлтый уровень, ещё 12 с наблюдения. Ёмкость, щёлочь, эффективный КПД, «ёлочки», — тире.</div>
    </div>
  </div>
</template>
<main id="m"></main>
<script>
const fonts = [
  ["Onest", "Гротеск, Google Fonts, вариативный"],
  ["Geologica", "Гротеск с осями резкости и наклона, Google Fonts"],
  ["Golos Text", "Интерфейсный гротеск Paratype, Google Fonts"],
  ["Wix Madefor Display", "Дисплейный гротеск Wix, Google Fonts"],
  ["Commissioner", "Гротеск с осью характера, Google Fonts"],
  ["Jost", "Геометрика в духе Futura, Google Fonts"],
  ["Geist", "Гротеск Vercel, Google Fonts"],
  ["Martian Mono", "Широкий моноширинный, Google Fonts", "mono"],
  ["IBM Plex Mono", "Моноширинный IBM, Google Fonts", "mono"],
  ["Geist Mono", "Моноширинный Vercel, Google Fonts", "mono"],
]
const t = document.getElementById("t")
const m = document.getElementById("m")
for (const [f, note, kind] of fonts) {
  const n = t.content.cloneNode(true)
  const row = n.querySelector(".row")
  row.style.fontFamily = `"${f}", monospace`
  if (kind) row.classList.add(kind)
  n.querySelector("b").textContent = f
  n.querySelector(".note").textContent = note
  row.querySelector(".name").style.fontFamily = "system-ui"
  row.dataset.font = f
  m.appendChild(n)
}
document.fonts.ready.then(() => {
  for (const row of document.querySelectorAll(".row")) {
    const f = row.dataset.font
    const ok = document.fonts.check(`16px "${f}"`, "ЁёЖжЩщ")
    if (!ok) row.querySelector(".check").textContent = "не загрузился"
  }
  document.body.dataset.ready = "1"
})
</script>
</body>
</html>
