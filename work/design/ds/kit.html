<html lang="ru" data-theme="dark">
<head>

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Набор компонентов</title>
<script>try { document.documentElement.dataset.theme = localStorage.getItem("ds-theme") === "light" ? "light" : "dark" } catch {}</script>
<link rel="stylesheet" href="/frontend/node_modules/@fontsource-variable/onest/index.css">
<link rel="stylesheet" href="/frontend/src/shared/styles/global.css">
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="kit-base.css">
<link rel="stylesheet" href="kit-button.css">
<link rel="stylesheet" href="kit-field.css">
<link rel="stylesheet" href="kit-form.css">
<link rel="stylesheet" href="kit-choice.css">

<link rel="stylesheet" href="kit-tabs.css">

<link rel="stylesheet" href="kit-layer.css">
<link rel="stylesheet" href="kit-select.css">
<link rel="stylesheet" href="kit-popover.css">
<link rel="stylesheet" href="kit-dialog.css">
<link rel="stylesheet" href="kit-message.css">
<link rel="stylesheet" href="kit-table.css">

<body>
<header class="kit-bar">
  <a class="kit-brand brand" href="index.html" aria-label="duppel, дизайн-система"><svg class="brand-lockup" aria-hidden="true"><use href="brand.svg#lockup" width="100%" height="100%"/></svg></a>
  <nav class="site-nav" aria-label="Дизайн-система" data-site-nav></nav>
  <div class="segmented segmented-icons" role="radiogroup" aria-label="Тема" data-segmented data-theme-switch>
    <button type="button" role="radio" aria-checked="true" data-value="dark" aria-label="Тёмная тема" data-tip="Тёмная тема"><svg class="icon" aria-hidden="true"><use href="icons.svg#moon"/></svg></button>
    <button type="button" role="radio" aria-checked="false" data-value="light" aria-label="Светлая тема" data-tip="Светлая тема"><svg class="icon" aria-hidden="true"><use href="icons.svg#sun"/></svg></button>
  </div>
</header>
<div class="kit">
  <nav class="kit-nav" aria-label="Компоненты" data-nav></nav>
  <main class="kit-main" data-parts></main>
</div>
<div class="toasts" data-toasts aria-live="polite"></div>
</body>
</html>
