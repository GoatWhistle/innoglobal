<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Иконки действий</title>
<link rel="stylesheet" href="/frontend/node_modules/@fontsource-variable/onest/index.css">
<link rel="stylesheet" href="/frontend/src/shared/styles/global.css">
<link rel="stylesheet" href="kit-base.css">
<link rel="stylesheet" href="kit-button.css">
<style>
body { padding: 32px; background: var(--surface-base); }
.grid { display: grid; grid-template-columns: 120px repeat(5, 1fr); gap: 20px 24px; align-items: center; margin-block-end: 40px; }
.cell { display: grid; gap: 10px; justify-items: start; }
.big { display: flex; gap: 18px; align-items: center; color: var(--text-primary); }
.big svg { inline-size: 48px; block-size: 48px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: butt; stroke-linejoin: miter; }
.cap { color: var(--text-muted); font-size: 12px; }
h2 { font-weight: 300; font-size: 14px; color: var(--text-secondary); margin: 0; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="s1" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.25v7.5L15.75 12z"/></symbol>
  <symbol id="s2" viewBox="0 0 24 24"><path d="M3 7.5h9M3 12h15M3 16.5h9M15 8.5l3.5 3.5-3.5 3.5"/></symbol>
  <symbol id="s3" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></symbol>
  <symbol id="s4" viewBox="0 0 24 24"><path d="M2.5 12c1.6-2.7 3.4-2.7 5 0s3.4 2.7 5 0 3.4-2.7 5 0M17 8.5l3.5 3.5-3.5 3.5"/></symbol>
  <symbol id="s5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M7 12h9.5M13 8.5l3.5 3.5-3.5 3.5"/></symbol>
  <symbol id="v1" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2"/><path d="M12 3.5V10M4.6 16.25l5.67-3.25M19.4 16.25l-5.67-3.25"/></symbol>
  <symbol id="v2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M7 12h10"/></symbol>
  <symbol id="v3" viewBox="0 0 24 24"><path d="M2 9h6.5M2 15h6.5M15.5 9H22M15.5 15H22M10.5 6v12M13.5 6v12M8 4h8"/></symbol>
  <symbol id="v4" viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"/><circle cx="12" cy="8" r="1.25"/><path d="M12 13v3M3 16.5h18M3 21h18"/></symbol>
  <symbol id="v5" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14"/></symbol>
</svg>
<template id="rows">
  <div class="grid">
    <h2>Запустить</h2>
    <div class="cell"><div class="big"><svg><use href="#s1"/></svg></div><button class="button button-primary"><svg class="icon"><use href="#s1"/></svg><span>Запустить</span></button><span class="cap">S1 пуск в круге</span></div>
    <div class="cell"><div class="big"><svg><use href="#s2"/></svg></div><button class="button button-primary"><svg class="icon"><use href="#s2"/></svg><span>Запустить</span></button><span class="cap">S2 струи потока</span></div>
    <div class="cell"><div class="big"><svg><use href="#s3"/></svg></div><button class="button button-primary"><svg class="icon"><use href="#s3"/></svg><span>Запустить</span></button><span class="cap">S3 пуск</span></div>
    <div class="cell"><div class="big"><svg><use href="#s4"/></svg></div><button class="button button-primary"><svg class="icon"><use href="#s4"/></svg><span>Запустить</span></button><span class="cap">S4 волна течения</span></div>
    <div class="cell"><div class="big"><svg><use href="#s5"/></svg></div><button class="button button-primary"><svg class="icon"><use href="#s5"/></svg><span>Запустить</span></button><span class="cap">S5 стрелка в круге</span></div>
    <h2>Перекрыть</h2>
    <div class="cell"><div class="big"><svg><use href="#v1"/></svg></div><button class="button button-danger"><svg class="icon"><use href="#v1"/></svg><span>Перекрыть</span></button><span class="cap">V1 маховик задвижки</span></div>
    <div class="cell"><div class="big"><svg><use href="#v2"/></svg></div><button class="button button-danger"><svg class="icon"><use href="#v2"/></svg><span>Перекрыть</span></button><span class="cap">V2 знак запрета</span></div>
    <div class="cell"><div class="big"><svg><use href="#v3"/></svg></div><button class="button button-danger"><svg class="icon"><use href="#v3"/></svg><span>Перекрыть</span></button><span class="cap">V3 шибер в трубе</span></div>
    <div class="cell"><div class="big"><svg><use href="#v4"/></svg></div><button class="button button-danger"><svg class="icon"><use href="#v4"/></svg><span>Перекрыть</span></button><span class="cap">V4 маховик на трубе</span></div>
    <div class="cell"><div class="big"><svg><use href="#v5"/></svg></div><button class="button button-danger"><svg class="icon"><use href="#v5"/></svg><span>Перекрыть</span></button><span class="cap">V5 стоп</span></div>
  </div>
</template>
<main id="m"></main>
<script>
document.getElementById("m").append(document.getElementById("rows").content.cloneNode(true))
</script>
</body>
</html>
