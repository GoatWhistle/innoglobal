<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Журнал | PipeTwin</title>
<script>try { document.documentElement.dataset.theme = localStorage.getItem("ds-theme") === "light" ? "light" : "dark" } catch {}</script>
<link rel="stylesheet" href="/frontend/node_modules/@fontsource-variable/onest/index.css">
<link rel="stylesheet" href="/frontend/src/shared/styles/global.css">
<link rel="stylesheet" href="screens-base.css">
<link rel="stylesheet" href="screens-shell.css">
<link rel="stylesheet" href="screens-dock.css">
<link rel="stylesheet" href="screens-journal.css">
<script type="module" src="screens-journal.js"></script>
</head>
<body>
<div class="app">
<main class="app-main jr" id="main">
  <aside class="jr-rail" aria-labelledby="flt-title">
    <div class="sd-head"><h2 class="sd-h2" id="flt-title">Фильтры</h2><button type="button" class="button button-quiet button-sm"><svg class="icon" aria-hidden="true"><use href="icons.svg#reset"/></svg><span>Сбросить</span></button></div>
    <div class="field"><span class="field-label" id="dr-l">Период</span><button type="button" class="input select-trigger" aria-labelledby="dr-l dr-v"><svg class="icon" aria-hidden="true"><use href="icons.svg#calendar"/></svg><span class="select-value sd-num" id="dr-v">Сегодня, 00:00–14:33</span><svg class="icon" aria-hidden="true"><use href="icons.svg#chevron-down"/></svg></button></div>
    <div class="field"><span class="field-label">Тип события</span>
      <div class="jr-tags" role="group" aria-label="Тип события">
        <button type="button" class="tag" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="icons.svg#alarm"/></svg><span>Утечки 3</span></button>
        <button type="button" class="tag" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="icons.svg#warning"/></svg><span>Расхождения 14</span></button>
        <button type="button" class="tag" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="icons.svg#sensor-off"/></svg><span>Датчики 2</span></button>
        <button type="button" class="tag" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="icons.svg#check"/></svg><span>Действия 9</span></button>
        <button type="button" class="tag" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="icons.svg#sliders"/></svg><span>Модель 4</span></button>
      </div>
    </div>
    <div class="field"><span class="field-label">Датчик</span><button type="button" class="input select-trigger"><span class="select-value">Все датчики</span><svg class="icon" aria-hidden="true"><use href="icons.svg#chevron-down"/></svg></button></div>
    <div class="field"><span class="field-label">Кто</span><button type="button" class="input select-trigger"><span class="select-value">Система и операторы</span><svg class="icon" aria-hidden="true"><use href="icons.svg#chevron-down"/></svg></button></div>
  </aside>

  <section class="jr-main" aria-labelledby="jr-title">
    <div class="jr-top">
      <div><h1 class="sd-h1" id="jr-title">Журнал</h1><p class="sd-muted sd-num" data-count>284 события за сегодня, показаны 28 по фильтрам</p></div>
      <div class="jr-tools">
        <div class="input input-search jr-search" data-empty><svg class="icon" aria-hidden="true"><use href="icons.svg#search"/></svg><input type="search" aria-label="Поиск по журналу" placeholder="Датчик, место или событие" data-query><kbd class="kbd">/</kbd></div>
        <button type="button" class="button button-secondary jr-filter-btn"><svg class="icon" aria-hidden="true"><use href="icons.svg#filter"/></svg><span>Фильтры 3</span></button>
        <button type="button" class="button button-secondary"><svg class="icon" aria-hidden="true"><use href="icons.svg#download"/></svg><span>Выгрузить</span></button>
      </div>
    </div>
    <div class="table-wrap jr-table">
      <table class="table" data-table>
        <thead><tr><th aria-sort="descending"><button type="button" class="sort-button">Время<svg class="icon" aria-hidden="true"><use href="icons.svg#sort-desc"/></svg></button></th><th>Событие</th><th>Место</th><th>Датчики</th><th class="num">Невязка, МПа</th><th>Кто</th></tr></thead>
        <tbody data-rows></tbody>
      </table>
    </div>
    <div class="pagination jr-pages" data-pages><span class="sd-num">1–12 из 28</span><div class="pages"><button type="button" class="icon-button icon-button-sm" aria-label="Предыдущая страница" disabled><svg class="icon" aria-hidden="true"><use href="icons.svg#chevron-left"/></svg></button><button type="button" class="page" aria-current="page">1</button><button type="button" class="page">2</button><button type="button" class="page">3</button><button type="button" class="icon-button icon-button-sm" aria-label="Следующая страница"><svg class="icon" aria-hidden="true"><use href="icons.svg#chevron-right"/></svg></button></div></div>
  </section>
</main>
</div>
</body>
</html>
