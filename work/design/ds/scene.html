<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PipeTwin</title>
<script>
  try {
    const saved = localStorage.getItem("ds-theme")
    if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved
  } catch {}
</script>
<link rel="stylesheet" href="/frontend/node_modules/@fontsource-variable/onest/index.css">
<link rel="stylesheet" href="/frontend/node_modules/@fontsource-variable/raleway/wght-italic.css">
<link rel="stylesheet" href="/frontend/src/shared/styles/global.css">
<link rel="stylesheet" href="scene.css">
<script type="importmap">
{ "imports": { "three": "/frontend/node_modules/three/build/three.module.js", "three/addons/": "/frontend/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<main class="scene" data-scene-root data-phase="idle">
  <canvas class="scene-canvas" data-scene tabindex="0" aria-label="Участок трубопровода 12 000 м. Нажмите Enter, чтобы вставить утечку"></canvas>
  <canvas class="scene-canvas scene-paper" data-drawing aria-hidden="true"></canvas>

  <header class="scene-bar">
    <span class="scene-mark">PipeTwin</span>
    <button class="scene-icon" type="button" data-theme-toggle aria-label="Светлая тема">
      <svg class="icon" aria-hidden="true"><use href="icons.svg#sun"/></svg>
    </button>
  </header>

  <div class="scene-labels" aria-hidden="true">
    <span class="scene-tag is-below" data-label="start">0 м</span>
    <span class="scene-tag is-below" data-label="end">12 000 м</span>
    <span class="scene-tag is-line is-up" data-label="model">модель</span>
    <span class="scene-tag is-line is-down" data-label="measured">замер</span>
    <span class="scene-tag is-hover" data-label="hover"></span>
    <span class="scene-tag is-estimate" data-label="estimate"></span>
    <span class="scene-tag scene-legend" data-label="legend">
      <span class="legend-item"><svg class="legend-swatch" viewBox="0 0 24 4" aria-hidden="true"><path d="M0 2h24" stroke-width="1"/></svg>модель</span>
      <span class="legend-item"><svg class="legend-swatch" viewBox="0 0 24 4" aria-hidden="true"><path d="M0 2h24" stroke-width="2"/></svg>замер</span>
    </span>
  </div>

  <section class="scene-status" data-status="idle" aria-live="polite">
    <p class="status-caption" data-caption>Участок 12 км, шесть датчиков давления</p>
    <p class="status-figure" data-figure>Утеч<em>е</em>к нет</p>
    <p class="status-detail" data-detail></p>
    <button class="scene-pill" type="button" data-reset hidden>
      <svg class="icon" aria-hidden="true"><use href="icons.svg#reset"/></svg>
      <span>Сбросить</span>
    </button>
  </section>

  <p class="scene-hint">Кликните по трубе, чтобы вставить утечку</p>
</main>
<script type="module" src="scene/chrome.js"></script>
<script type="module" src="scene/main.js"></script>
</body>
</html>
