<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Модель | duppel</title>
<script>try { document.documentElement.dataset.theme = localStorage.getItem("ds-theme") === "light" ? "light" : "dark" } catch {}</script>
<link rel="stylesheet" href="/frontend/node_modules/@fontsource-variable/onest/index.css">
<link rel="stylesheet" href="/frontend/src/shared/styles/global.css">
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="screens-base.css">
<link rel="stylesheet" href="screens-shell.css">
<link rel="stylesheet" href="screens-dock.css">
<link rel="stylesheet" href="screens-chart.css">
<link rel="stylesheet" href="screens-model.css">
<script type="module" src="screens-model.js"></script>
</head>
<body>
<div class="app">
<main class="app-main md" id="main">
  <section class="md-form" aria-labelledby="md-title">
    <div class="md-head"><h1 class="sd-h1" id="md-title">Модель участка 2</h1><p class="sd-muted">Гидравлический расчёт и правила тревоги. Превью справа считается сразу, участок меняется только после применения.</p></div>
    <form class="md-fields" data-form novalidate></form>
    <div class="md-fixed"><h2 class="sd-h2">Постоянные участка</h2><dl class="facts" data-fixed></dl></div>
    <div class="md-actions">
      <p class="sd-caption md-dirty" data-dirty role="status"></p>
      <div class="sd-row">
        <button type="button" class="button button-secondary" data-revert><svg class="icon" aria-hidden="true"><use href="icons.svg#reset"/></svg><span>Отменить правки</span></button>
        <button type="button" class="button button-primary" data-apply data-ms="1200"><svg class="icon" aria-hidden="true"><use href="icons.svg#check"/></svg><span>Применить к участку</span></button>
      </div>
    </div>
  </section>
  <section class="md-preview" aria-labelledby="pv-title">
    <div class="md-preview-head"><div><h2 class="sd-h2" id="pv-title">Как изменится расчёт</h2><p class="sd-caption" data-note></p></div><span data-badge></span></div>
    <div data-banner></div>
    <div class="md-body" data-body>
      <div class="md-chart" data-chart></div>
      <div data-legend></div>
      <div class="table-wrap md-compare"><table class="table"><caption class="sd-visually-hidden">Сравнение расчёта до и после правки</caption><thead><tr><th>Показатель</th><th class="num">Сейчас</th><th class="num">После правки</th><th class="num">Разница</th></tr></thead><tbody data-compare></tbody></table></div>
      <p class="sd-caption md-method" data-method></p>
    </div>
  </section>
</main>
</div>
</body>
</html>
