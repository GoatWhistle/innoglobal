[project]
name = "pipetwin"
version = "1.0.0"
description = "Прогноз минимальной остаточной толщины стенки трубопроводов по данным ВТД"
requires-python = ">=3.12"
dependencies = [
    "catboost==1.2.10",
    "duckdb==2.0.0",
    "joblib==1.6.0",
    "lightgbm==4.7.0",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "xgboost==3.4.1",
]

[project.scripts]
pipetwin = "pipetwin.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipetwin"]

[tool.ruff]
line-length = 125
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E741"]
