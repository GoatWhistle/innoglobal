name: ${COMPOSE_PROJECT_NAME:-duppel}

services:
  # Конвейер ML: data/*.csv -> хранилище -> модели -> result.csv и артефакты в томе results.
  # При повторном запуске ничего не пересчитывает, если результаты уже есть.
  # Пересчитать принудительно: docker compose run --rm pipeline python -m pipetwin
  pipeline:
    build:
      context: ml
    image: ${COMPOSE_PROJECT_NAME:-duppel}-pipeline:${TAG:-latest}
    volumes:
      - ./data:/input:ro
      - results:/out
    restart: "no"

  backend:
    build:
      context: backend
      args:
        LLM: ${LLM:-false}
    image: ${COMPOSE_PROJECT_NAME:-duppel}-backend:${TAG:-latest}
    depends_on:
      pipeline:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      DATA_ROOT: /data
      STATE_ROOT: /state
    volumes:
      - results:/data
      - ./docs/methodology:/data/docs/methodology:ro
      - assistant-state:/state
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      args:
        SITE_URL: ${SITE_URL:-}
    image: ${COMPOSE_PROJECT_NAME:-duppel}-frontend:${TAG:-latest}
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  results:
  assistant-state:
